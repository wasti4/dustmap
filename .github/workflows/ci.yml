name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: dustmap-windows
            files: release/*.exe
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: dustmap-macos-arm64
            files: release/*-arm64.dmg
          - name: macOS Intel
            runner: macos-15-intel
            artifact: dustmap-macos-x64
            files: release/*-x64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npm run typecheck
      - run: npm test
      - run: SC_NO_HELPER=1 node dist-electron/cli.cjs --selftest
        if: runner.os == 'macOS'
        name: Test macOS without the native helper

      - name: Test the startup disk and a case-sensitive APFS volume
        if: matrix.artifact == 'dustmap-macos-arm64'
        shell: bash
        run: |
          image="$RUNNER_TEMP/dustmap-fixture.sparseimage"
          volume="/Volumes/Dustmap Fixture"
          hdiutil create -type SPARSE -size 128m -fs 'Case-sensitive APFS' -uid "$(id -u)" -gid "$(id -g)" -volname 'Dustmap Fixture' "$image"
          hdiutil attach -owners on -nobrowse "$image"
          trap 'hdiutil detach "$volume"' EXIT
          DUSTMAP_TEST_STARTUP=1 DUSTMAP_TEST_VOLUME="$volume" node dist-electron/cli.cjs --selftest

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist -- --publish never

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run dist -- --publish never -c.mac.identity=-
        env:
          # PR builds use a local ad-hoc identity and receive no signing credentials.
          CSC_FOR_PULL_REQUEST: 'true'

      - name: Mount and smoke-test the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil verify ${{ matrix.files }}
          mount="$RUNNER_TEMP/dustmap-dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" ${{ matrix.files }}
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/Dustmap.app"
          node scripts/desktop-smoke.mjs "$mount/Dustmap.app/Contents/MacOS/Dustmap"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
