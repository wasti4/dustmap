name: Release

# A version tag builds all supported packages and attaches them to a draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: dustmap-windows
            files: release/*.exe
          - runner: macos-15
            artifact: dustmap-macos-arm64
            files: release/*-arm64.dmg
          - runner: macos-15-intel
            artifact: dustmap-macos-x64
            files: release/*-x64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist -- --publish never
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CSC_LINK" && -z "$APPLE_ID" && -z "$APPLE_APP_SPECIFIC_PASSWORD" && -z "$APPLE_TEAM_ID" ]]; then
            echo "::warning::The draft macOS installer is ad-hoc signed. Configure Developer ID and notarization before public distribution."
            npm run dist -- --publish never -c.mac.identity=-
          elif [[ -n "$CSC_LINK" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            npm run dist -- --publish never -c.forceCodeSigning=true -c.mac.notarize=true
            app=$(find release -type d -name Dustmap.app -print -quit)
            xcrun stapler validate "$app"
          else
            echo "::error::Configure both Developer ID signing and Apple notarization credentials."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dustmap-*
          merge-multiple: true
          path: packages
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            packages/*.exe
            packages/*.dmg
